server:
  port: 8081
  error:
    # Mostra a mensagem da exceção na resposta de erro. Assim o 503 diz QUAL comprovante falhou
    # ("não foi possível gravar o comprovante <id>"). O Spring Boot esconde por padrão,
    # para não vazar detalhes internos: aqui a mensagem é nossa e é útil para o cliente.
    include-message: always

spring:
  application:
    name: comprovante-emissor
  jackson:
    property-naming-strategy: SNAKE_CASE   # JSON em snake_case (contrato do módulo)
    default-property-inclusion: non_null
  datasource:
    url: jdbc:h2:mem:emissor;DB_CLOSE_DELAY=-1   # base SEGREGADA deste serviço (ADR-001)
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true   # http://localhost:8081/h2-console (JDBC URL: jdbc:h2:mem:emissor, usuário sa)
  # Aula 5: o RabbitMQ, onde fica a fila de gravação. No Docker, o docker-compose.yml troca
  # o "localhost" por "rabbitmq". O GravacaoAdapter publica o pedido de gravação na fila
  # (exercício da Aula 5).
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# Aula 2 — onde está o gravador (passo remoto da SAGA) e quanto tempo esperar por ele
gravador:
  base-url: http://localhost:8082
  timeout-ms: 2000

management:
  endpoints:
    web:
      exposure:
        include: health,info
