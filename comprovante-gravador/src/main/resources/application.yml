server:
  port: 8082

spring:
  application:
    name: comprovante-gravador
  jackson:
    property-naming-strategy: SNAKE_CASE   # mesmo contrato JSON do emissor
  datasource:
    url: jdbc:h2:mem:gravador;DB_CLOSE_DELAY=-1   # base SEGREGADA deste serviço
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true   # http://localhost:8082/h2-console (JDBC URL: jdbc:h2:mem:gravador, usuário sa)
  # Aula 5: o RabbitMQ, onde fica a fila de gravação. No Docker, o docker-compose.yml troca
  # o "localhost" por "rabbitmq". O painel fica em http://localhost:15672 (guest / guest).
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto   # o Spring manda o ack quando o ConsumidorDeGravacao termina sem erro
        # Passo 5 do exercício: o retry com backoff. Quando der erro, tentar de novo algumas vezes,
        # esperando cada vez mais. Esgotou as tentativas? A mensagem vai para a DLQ.
        retry:
          enabled: true          # ligado no passo 5 do exercício da Aula 5
          max-attempts: 3        # 3 tentativas ao todo: a primeira e mais duas
          initial-interval: 1s   # espera 1 segundo antes da 2ª tentativa...
          multiplier: 2          # ...e o dobro (2 segundos) antes da 3ª
  # Aula 6: o Kafka, onde fica o tópico comprovante-gravado. No Docker, o docker-compose.yml troca
  # o "localhost:9092" por "kafka:19092". O painel fica em http://localhost:8090 (Kafka UI).
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # A chave (o id do comprovante) vai como texto; o fato, em JSON.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # O ack do produtor: espera a líder e as réplicas em dia guardarem.
      acks: all   # já é o padrão desde o Kafka 3.0; fica escrito para a turma ver
      properties:
        # Não põe o nome da classe Java no cabeçalho da mensagem: quem lê já sabe o que vem.
        spring.json.add.type.headers: false
        # Com o Kafka fora do ar, o send espera no máximo 5 segundos, e não 60 (o padrão).
        # Enquanto espera, o gravador não pega a próxima mensagem da fila de gravação.
        max.block.ms: 5000

# Só para as demos. Nada disso existe num gravador de verdade.
demo:
  # Aula 2: o gravador grava, mas demora para responder (o "não sei").
  # Ex.: DEMO_ATRASO_MS=3000 docker compose up -d gravador
  atraso-ms: 0
  # Aula 4: toda leitura (GET) demora 1 segundo, como um banco cheio no horário de pico.
  # É de mentira, para a diferença que o cache faz aparecer no tempo da consulta.
  leitura-lenta-ms: 1000
  # Aula 5, passo 3: o gravador grava e "cai" ANTES do ack. Na reentrega, o comprovante já
  # está gravado, e aí ele não cai. Ex.: DEMO_FALHAR_ANTES_DO_ACK=true docker compose up gravador
  falhar-antes-do-ack: false
  # Aula 5, desafio extra: o banco "pisca" nas primeiras N tentativas de cada comprovante.
  # Ex.: DEMO_FALHAS_PASSAGEIRAS=2 docker compose up gravador
  falhas-passageiras: 0

# Aula 5: cada erro no ConsumidorDeGravacao já aparece numa linha só ("Deu erro no comprovante...").
# Sem isto, o Spring repete o mesmo erro com umas 30 linhas de detalhe (o stack trace), a cada entrega.
logging:
  level:
    org.springframework.amqp.rabbit.listener.ConditionalRejectingErrorHandler: error
    # Aula 6: a biblioteca do Kafka escreve dezenas de linhas de configuração ao subir. Só os avisos.
    org.apache.kafka: warn

management:
  endpoints:
    web:
      exposure:
        include: health,info
