server:
  port: 8082

spring:
  application:
    name: comprovante-gravador
  jackson:
    property-naming-strategy: SNAKE_CASE   # mesmo contrato JSON do emissor
  datasource:
    url: jdbc:h2:mem:gravador;DB_CLOSE_DELAY=-1   # base SEGREGADA deste serviço
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true   # http://localhost:8082/h2-console (JDBC URL: jdbc:h2:mem:gravador, usuário sa)

# Só para a demo do "não sei" (Aula 2): o gravador grava, mas demora para responder.
# Ex.: mvn -pl comprovante-gravador spring-boot:run -Dspring-boot.run.arguments=--demo.atraso-ms=3000
demo:
  atraso-ms: 0
  # Aula 4: toda leitura (GET) demora 1 segundo, como um banco cheio no horário de pico.
  # É de mentira, para a diferença que o cache faz aparecer no tempo da consulta.
  leitura-lenta-ms: 1000

# ------------------------------------------------------------------------------
# TODO (Aula 5) — consumir a fila de gravação (RabbitMQ)
# TODO (Aula 7) — publicar o evento "comprovante gravado" (Kafka)
# ------------------------------------------------------------------------------

management:
  endpoints:
    web:
      exposure:
        include: health,info
